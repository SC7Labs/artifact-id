name: YAML Merge Keys
on: [push]

.common_step: &download_step
  uses: actions/download-artifact@v4
  with:
    name: web-dist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - <<: *download_step
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - <<: *download_step
      - run: npm run deploy
