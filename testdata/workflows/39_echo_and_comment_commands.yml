name: Echo and Comment Commands
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "npm run build"
          echo "starting build..."
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - run: |
          # npm run deploy
          echo "deploying to stage"
          npm test
