name: Multiple Artifacts
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-bundle
          path: client/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: server/dist/
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-bundle
      - uses: actions/download-artifact@v4
        with:
          name: server-bundle
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-bundle
      - uses: actions/download-artifact@v4
        with:
          name: server-bundle
      - run: npm run deploy
