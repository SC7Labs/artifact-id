name: Matrix Cross Compile
on:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: go build -o bin/cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: bin/cli
  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.os }}
      - run: go test ./...
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-ubuntu-latest
      - run: npm run deploy
