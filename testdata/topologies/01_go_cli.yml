name: Go CLI Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go build -v -o bin/mycli ./cmd/mycli
      - uses: actions/upload-artifact@v4
        with:
          name: mycli-binary
          path: bin/mycli
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/download-artifact@v4
        with:
          name: mycli-binary
      - run: go test -v ./...
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mycli-binary
      - uses: softprops/action-gh-release@v2
        with:
          files: mycli
